[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]

name = "staketracker"
dynamic = ["version"]
description = "Detects stakes on glaciers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
    "scipy",
    "piexif>=1.1.3",
    "pandas>=3.0.2",
    "requests-cache>=1.3.1",
    "openmeteo-requests>=1.7.5",
    "retry-requests>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=9.0.3",
]
jupyter = [
    "jupyterlab>=4.5.6",
    "ipywidgets>=8.1.8",
]


[tool.setuptools.packages.find]
include = ["staketracker*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["staketracker"]

[tool.setuptools_scm]
# Writes _version.py into the package so the version is available at runtime
# even when the package is installed without the .git directory.
write_to = "staketracker/_version.py"

