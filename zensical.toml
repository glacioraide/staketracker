[project]
site_name = "staketracker"
site_description = "Detects stakes on glaciers"
site_url = "https://glacioraide.github.io/staketracker/"
repo_url = "https://github.com/glacioraide/staketracker"
repo_name = "glacioraide/staketracker"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
    { "Home" = "index.md" },
    { "Detection step by step" = "notebooks/pipeline_step_by_step.md" },
    { "API reference" = [
        "api/index.md",
        "api/detection.md",
        "api/filters.md",
        "api/io.md",
        "api/meteo.md",
        "api/plot.md",
    ] },
]

[project.theme]
features = [
    "content.action.edit",
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "lucide/sun-moon", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Switch to system preference" }

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://pandas.pydata.org/docs/objects.inv",
    "https://matplotlib.org/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "table"
# Lets docstrings link to a sibling with [`name`][] instead of the full path.
scoped_crossrefs = true
relative_crossrefs = true
signature_crossrefs = true
separate_signature = true
show_signature_annotations = true
modernize_annotations = true
show_symbol_type_heading = true
show_symbol_type_toc = true
summary = true
show_root_heading = true
heading_level = 1
show_source = true
members_order = "source"
merge_init_into_class = true
filters = ["!^_"]
